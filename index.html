<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathematics papers · Madhup</title>
  <meta name="description" content="Mathematical papers and notes by Madhup. Read each paper as a PDF.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23192d50'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='27' fill='white' font-family='serif'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#172944;--muted:#607087;--line:#dce3ec;--blue:#234fb5;--bg:#f8fafc}
    *{box-sizing:border-box}html{font-size:16px}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.6;min-height:100svh;display:flex;flex-direction:column}
    a{color:inherit}a:focus-visible{outline:3px solid #668ce9;outline-offset:6px;border-radius:4px}
    .wrap{width:min(100% - 64px,960px);margin-inline:auto}header{border-bottom:1px solid var(--line);background:#fff}.header-inner{min-height:96px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .identity{display:flex;align-items:center;gap:13px;text-decoration:none;font-weight:600;font-size:1rem}.mark{display:grid;place-items:center;width:35px;height:35px;border-radius:9px;background:var(--ink);color:white;font-family:Georgia,serif;font-size:1.7rem;line-height:1}.header-label{color:var(--muted);font-size:.875rem}
    main{flex:1;padding-top:66px;padding-bottom:100px}.eyebrow{margin:0 0 15px;color:var(--blue);font-size:.875rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(2.7rem,6vw,4.25rem);line-height:1.13;letter-spacing:-.045em;margin:0 0 18px}.intro{max-width:520px;margin:0;color:var(--muted);font-size:1.0625rem}
    .collection-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:59px;margin-bottom:17px}h2{font-size:.875rem;font-weight:600;margin:0;letter-spacing:.04em}.count{font-size:.875rem;color:var(--muted)}.papers{border-top:1px solid var(--line)}
    .empty{margin-top:0;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:white;text-align:center;padding:64px 24px 69px}.empty-icon{width:42px;height:42px;color:#8495ad;margin-bottom:17px}.empty h3{font-family:Georgia,'Times New Roman',serif;font-size:1.6rem;font-weight:400;margin:0 0 9px}.empty p{color:var(--muted);margin:0;font-size:1rem}.paper{position:relative;display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:22px;padding:30px 23px;border-bottom:1px solid var(--line);text-decoration:none;transition:background .18s ease,box-shadow .18s ease}.paper:hover{background:white;box-shadow:inset 3px 0 var(--blue)}.number{align-self:start;margin-top:5px;font-size:.875rem;font-family:monospace;color:var(--muted)}.paper h3{font-family:Georgia,'Times New Roman',serif;font-size:1.6rem;font-weight:400;line-height:1.35;margin:0 0 8px;overflow-wrap:anywhere}.meta{font-size:.875rem;color:var(--muted)}.description{color:var(--muted);margin:12px 0 0;max-width:600px}.pdf{border:1px solid #cfdaeb;border-radius:7px;white-space:nowrap;padding:8px 14px;color:var(--blue);font-size:.875rem;background:white;font-weight:600}.pdf svg{vertical-align:-3px;margin-right:7px;width:16px;height:16px}.paper:hover .pdf{border-color:var(--blue)}
    footer{border-top:1px solid var(--line)}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:84px;font-size:.875rem;color:var(--muted)}.footer-name{color:var(--ink)}
    @media(max-width:600px){.wrap{width:calc(100% - 40px)}.header-inner{min-height:78px}.header-label{font-size:.8125rem}main{padding-top:45px;padding-bottom:65px}.collection-head{margin-top:43px}.empty{padding:48px 16px}.paper{grid-template-columns:27px 1fr;gap:12px;padding:25px 5px}.paper h3{font-size:1.4rem}.pdf{grid-column:2;justify-self:start;margin-top:6px}.footer-inner{align-items:flex-start;justify-content:center;flex-direction:column;gap:2px;padding-block:22px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header><div class="wrap header-inner"><a class="identity" href="./" aria-label="Madhup, home"><span class="mark" aria-hidden="true">∑</span><span>Madhup</span></a><span class="header-label">Mathematical writing</span></div></header>
  <main class="wrap">
    <p class="eyebrow">Mathematics</p>
    <h1>Papers &amp; notes.</h1>
    <p class="intro">A collection of my mathematical writing.<br>Open any paper to read the full PDF.</p>
    <div class="collection-head"><h2>THE COLLECTION</h2><span class="count" id="count" aria-live="polite"></span></div>
    <section class="papers" id="papers" aria-label="Mathematics papers" aria-live="polite">
      <div class="empty"><svg class="empty-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M9 3h10l6 6v19H7V3h2Z"/><path d="M19 3v7h6M12 16h8M12 21h6"/></svg><h3>No papers published yet.</h3><p>New papers will appear here.</p></div>
    </section>
  </main>
  <footer><div class="wrap footer-inner"><span class="footer-name">Madhup · Mathematics</span><span>Papers, proofs, and ideas.</span></div></footer>
  <script>
    const docIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h4M9 12h6M9 16h6"/></svg>';
    async function loadPapers(){
      const collection=document.getElementById('papers');
      try{
        const response=await fetch('./papers.json');if(!response.ok)throw new Error('Unavailable');
        const papers=await response.json();if(!Array.isArray(papers))throw new Error('Invalid collection');
        document.getElementById('count').textContent=papers.length+' '+(papers.length===1?'paper':'papers');
        if(!papers.length)return;
        const fragment=document.createDocumentFragment();
        papers.forEach((paper,index)=>{
          if(typeof paper.title!=='string'||typeof paper.pdf!=='string')throw new Error('Invalid paper');
          const url=new URL(paper.pdf,location.href);if(!['http:','https:'].includes(url.protocol))throw new Error('Invalid PDF URL');
          const link=document.createElement('a');link.className='paper';link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label','Read '+paper.title+' (PDF, opens in a new tab)');
          const number=document.createElement('span');number.className='number';number.textContent=String(index+1).padStart(2,'0');
          const content=document.createElement('div');const title=document.createElement('h3');title.textContent=paper.title;content.append(title);
          const details=[paper.subject,paper.date,paper.pages?paper.pages+' pages':null].filter(Boolean);if(details.length){const meta=document.createElement('div');meta.className='meta';meta.textContent=details.join(' · ');content.append(meta)}
          if(paper.description){const description=document.createElement('p');description.className='description';description.textContent=paper.description;content.append(description)}
          const action=document.createElement('span');action.className='pdf';action.innerHTML=docIcon+'Read PDF';link.append(number,content,action);fragment.append(link);
        });collection.replaceChildren(fragment);
      }catch(error){document.getElementById('count').textContent='';const heading=collection.querySelector('h3');const message=collection.querySelector('p');if(heading)heading.textContent='Papers are unavailable.';if(message)message.textContent='Please try again in a moment.'}
    }
    loadPapers();
  </script>
</body>
</html>
